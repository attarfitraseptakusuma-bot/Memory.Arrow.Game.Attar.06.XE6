<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mengingat Urutan Panah (Hyper Fast Mode)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            text-align: center;
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        #status {
            font-size: 18px;
            margin: 20px 0;
            min-height: 27px;
            color: #ffcc00;
        }

        #display-box {
            font-size: 80px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111116;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: all 0.05s;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .input-hint {
            font-size: 14px;
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Memory Arrow Game</h1>
    <div id="status">Tekan "Mulai Game" untuk bermain</div>
    <div id="display-box">—</div>
    <button id="start-btn" onclick="startGame()">Mulai Game</button>
    <div class="input-hint">Gunakan tombol keyboard: ⬅️ ⬆️ ⬇️ ➡️</div>
</div>

<script>
    // Konfigurasi Game
    const ARROWS = ['⬆️', '➡️', '⬇️', '⬅️'];
    const KEY_MAP = {
        'ArrowUp': '⬆️',
        'ArrowRight': '➡️',
        'ArrowDown': '⬇️',
        'ArrowLeft': '⬅️'
    };
    
    let sequence = [];
    let playerSequence = [];
    let isListeningInput = false;

    const statusEl = document.getElementById('status');
    const displayBoxEl = document.getElementById('display-box');
    const startBtn = document.getElementById('start-btn');

    // Fungsi untuk memulai game
    function startGame() {
        sequence = [];
        playerSequence = [];
        isListeningInput = false;
        startBtn.disabled = true;
        
        // 1. Buat urutan acak sebanyak 5 anak panah
        for (let i = 0; i < 5; i++) {
            const randomIndex = Math.floor(Math.random() * ARROWS.length);
            sequence.push(ARROWS[randomIndex]);
        }

        // 2. Tampilkan urutan ke pemain
        statusEl.innerText = "Perhatikan urutannya...";
        playSequence(0);
    }

    // Fungsi rekursif untuk menampilkan panah satu per satu setiap 0,5 detik
    function playSequence(index) {
        if (index < sequence.length) {
            // Tampilkan panah saat ini
            displayBoxEl.innerText = sequence[index];
            displayBoxEl.style.opacity = "1";
            
            // Pengaturan waktu total 0,5 detik (500ms)
            setTimeout(() => {
                displayBoxEl.style.opacity = "0"; // Sembunyikan sebentar agar ada jeda kedip
                setTimeout(() => {
                    playSequence(index + 1);
                }, 100); // Jeda kedip kosong 0,1 detik
            }, 400); // Panah tampil selama 0,4 detik
            
        } else {
            // Setelah semua panah selesai ditampilkan
            displayBoxEl.style.opacity = "1";
            displayBoxEl.innerText = "❓";
            statusEl.innerText = "Sekarang giliranmu! Masukkan urutannya:";
            isListeningInput = true;
        }
    }

    // Mendengarkan input keyboard dari pemain
    window.addEventListener('keydown', (e) => {
        if (!isListeningInput) return;

        if (KEY_MAP[e.key]) {
            e.preventDefault(); 
            
            const pressedArrow = KEY_MAP[e.key];
            playerSequence.push(pressedArrow);
            
            displayBoxEl.innerText = pressedArrow;
            
            checkInput();
        }
    });

    // Fungsi untuk memeriksa input pemain
    function checkInput() {
        const currentIndex = playerSequence.length - 1;

        if (playerSequence[currentIndex] !== sequence[currentIndex]) {
            statusEl.innerText = "❌ Salah! Urutanmu tidak tepat.";
            displayBoxEl.innerText = "💥";
            endGame();
            return;
        }

        if (playerSequence.length === sequence.length) {
            statusEl.innerText = "🎉 Hebat! Kamu berhasil mengingat semua urutan!";
            displayBoxEl.innerText = "👑";
            endGame();
        }
    }

    // Reset tombol untuk bermain lagi
    function endGame() {
        isListeningInput = false;
        startBtn.disabled = false;
        startBtn.innerText = "Main Lagi";
    }
</script>

</body>
</html>
